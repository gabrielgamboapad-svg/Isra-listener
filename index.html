<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica: EventListeners</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="contenedor">
    <h1 class="titulo">Práctica: EventListeners</h1>

    <!-- 1. Click con alert -->
    <button id="btnAlerta" class="boton">Haz clic (alert)</button>

    <!-- 2. Mouse sobre / fuera del cuadro -->
    <div id="cuadro" class="cuadro">Pasa el cursor por aquí</div>

    <!-- 3. Teclado (se escucha en toda la ventana) -->
    <p class="ayuda">Pulsa cualquier tecla (mira la consola). Prueba la tecla <strong>F</strong>.</p>

    <!-- 4. Evento input -->
    <input id="campoNombre" class="campo" type="text" placeholder="Escribe tu nombre">
    <h2 id="saludo" class="saludo"></h2>

    <!-- 5. Evento de una sola vez -->
    <button id="btnUnaVez" class="boton">Solo funciona una vez</button>
  </main>
</body>
</html>
